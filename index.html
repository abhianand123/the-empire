<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#08090C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>The Empire — Three Teen Founders Building The Future</title>
    <meta
      name="description"
      content="Three ambitious teenagers combining full-stack software & cybersecurity, top 2% global gold trading, and cinematic video editing to build a sovereign empire in the upcoming years."
    />
    <style>
      /* Critical FOUC Elimination - Instant Dark Ground */
      html, body {
        background-color: #08090C !important;
        color: #F2EAD9;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      #cinematic-viewport {
        background-color: #08090C;
        position: fixed;
        inset: 0;
        z-index: 0;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Ambient World Lighting & Glow (Fixed Background) -->
    <div id="ambient-glow" class="ambient-glow"></div>

    <!-- Cinematic Viewport (Fixed Background Videos & Stills Canvas) -->
    <div id="cinematic-viewport" class="cinematic-viewport"></div>

    <!-- Viewport Vignette & Depth Mask (Fixed Background Overlay) -->
    <div class="viewport-vignette"></div>

    <!-- Top Minimalist Header (Fixed) -->
    <header class="cosmos-header">
      <a class="brand-logo" href="#the-empire" id="brand-logo-link">
        <div class="brand-crest">E</div>
        <div>
          <div class="brand-title">The Empire</div>
          <div id="brand-subtitle" class="brand-subtitle">Founding Syndicate</div>
        </div>
      </a>
    </header>

    <!-- Main Vertical Scrollable Content Layer -->
    <main id="scroll-content" class="scroll-content"></main>

    <!-- Fixed Floating Bottom HUD & Scene Track -->
    <footer class="bottom-controls">
      <div class="scrub-track-wrapper">
        <!-- Interactive Progress Bar -->
        <div id="scrub-progress-bar" class="scrub-progress-bar" title="Click or Drag to Scrub">
          <div id="scrub-progress-fill" class="scrub-progress-fill"></div>
        </div>

        <!-- Scene Milestone Nodes (01, 02, 03, 04) -->
        <div id="scene-nodes" class="scene-nodes-row"></div>
      </div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
